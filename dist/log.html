<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>學習記錄</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gray-100 p-8">
    <div class="max-w-4xl mx-auto">
        <!-- Header with back button -->
        <div class="flex justify-between items-center mb-6">
            <div class="flex items-center gap-4">
                <a style="position:relative; z-index:1000;"  href="index.html" onclick="if (history.length > 1) { history.back(); return false; }"
                   class="bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold py-2 px-4 rounded-full transition-all hover:scale-105">
                    ← 返回首頁
                </a>
                <h1 class="text-3xl font-bold text-indigo-600">學習記錄</h1>
            </div>
            <button onclick="loadLogs()" class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-6 rounded-full">
                重新整理
            </button>
        </div>

        <!-- Tab buttons -->
        <div class="flex gap-4 mb-6">
            <button id="tab-test" onclick="switchTab('test-log')"
                class="px-6 py-3 rounded-full font-bold text-lg transition-all border-2 border-indigo-500 text-indigo-500 bg-white">
                練習記錄
            </button>
            <button id="tab-incorrect" onclick="switchTab('incorrect-log')"
                class="px-6 py-3 rounded-full font-bold text-lg transition-all border-2 border-gray-300 text-gray-400 bg-white hover:border-red-400 hover:text-red-400">
                錯誤記錄
            </button>
        </div>

        <div id="log-list" class="space-y-4"></div>
        <p id="empty" class="text-gray-500 text-center mt-10 hidden">暫無記錄</p>
    </div>

    <script type="module">
        import { getCookie } from './auth.js';
        import { startAfter } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';
        
        // Skip auto modal for logs but check user
        window.skipAuthInit = false; // We want researchers/students to see the login if not set
        
        let currentTab = 'test-log';
        let currentUsername = getCookie("math_username") || "";

        window.onUserSet = (username) => {
            currentUsername = username;
            loadLogs();
        };

        window.switchTab = function(tab) {
            currentTab = tab;
            document.getElementById('tab-test').className = tab === 'test-log'
                ? 'px-6 py-3 rounded-full font-bold text-lg transition-all border-2 border-indigo-500 text-indigo-500 bg-white'
                : 'px-6 py-3 rounded-full font-bold text-lg transition-all border-2 border-gray-300 text-gray-400 bg-white hover:border-indigo-400 hover:text-indigo-400';
            document.getElementById('tab-incorrect').className = tab === 'incorrect-log'
                ? 'px-6 py-3 rounded-full font-bold text-lg transition-all border-2 border-indigo-500 text-indigo-500 bg-white'
                : 'px-6 py-3 rounded-full font-bold text-lg transition-all border-2 border-gray-300 text-gray-400 bg-white hover:border-red-400 hover:text-red-400';
            loadLogs();
        };

        window.addEventListener('load', () => {});

        // ====== 讀取策略（2026-11-25：改為「索引查詢 + 快取 + 分批」，唔再掃全部記錄）======
        // 舊做法：where(username) + limit(300) 逐頁抓到「全部」，再在瀏覽器排序 → 記錄一多
        // （Gracefully 已有 940 筆錯誤記錄）就要 4 次往返 + 渲染，家長要等 1-2 分鐘。
        // 新做法：where(username) + orderBy(timestamp desc) + limit(200) → 一次查詢就拿到最新 200 筆。
        const PAGE = 200;
        let lastDoc = null;
        let loading = false;

        // 一次性索引（username ASC, timestamp DESC）—— 建好之後此頁只需 1 次查詢（~0.7 秒）
        const INDEX_URL = 'https://console.firebase.google.com/v1/r/project/p2math-791c8/firestore/indexes?create_composite=ClJwcm9qZWN0cy9wMm1hdGgtNzkxYzgvZGF0YWJhc2VzLyhkZWZhdWx0KS9jb2xsZWN0aW9uR3JvdXBzL2luY29ycmVjdC1sb2cvaW5kZXhlcy9fEAEaDAoIdXNlcm5hbWUQARoNCgl0aW1lc3RhbXAQAhoMCghfX25hbWVfXxAC';

        const cacheKey = (u, t) => `alanmath_log_${u}_${t}`;
        function readCache(u, t) {
            try { return JSON.parse(localStorage.getItem(cacheKey(u, t)) || 'null'); } catch (e) { return null; }
        }
        function writeCache(u, t, docs) {
            try { localStorage.setItem(cacheKey(u, t), JSON.stringify({ at: Date.now(), docs: docs })); } catch (e) {}
        }

        function renderDocs(list, docs) {
            docs.forEach((data) => {
                if (currentTab === 'test-log') renderTestLog(list, data.id, data);
                else renderIncorrectLog(list, data.id, data);
            });
        }

        function docsFromSnapshot(snap) {
            return snap.docs.map(d => ({ id: d.id, ...d.data() }));
        }

        function addMoreButton(list, count) {
            const old = document.getElementById('load-more');
            if (old) old.remove();
            if (count < PAGE) return;
            const btn = document.createElement('button');
            btn.id = 'load-more';
            btn.className = 'mx-auto mt-6 px-8 py-3 rounded-full bg-indigo-500 hover:bg-indigo-600 text-white font-bold text-lg shadow';
            btn.textContent = '載入更舊的 200 筆';
            btn.onclick = () => loadLogs(false, true);
            list.parentElement.appendChild(btn);
        }

        window.loadLogs = async function (force, append) {
            if (!currentUsername) {
                document.getElementById('log-list').innerHTML = '<p class="text-gray-500 text-center">請先登入以查看記錄</p>';
                return;
            }

            const list = document.getElementById('log-list');
            const empty = document.getElementById('empty');

            if (!window.db) {
                setTimeout(() => window.loadLogs(force, append), 500);
                return;
            }

            if (!append) {
                // 先畫快取（即時見到上次結果），再背景更新
                const cached = readCache(currentUsername, currentTab);
                if (cached && Array.isArray(cached.docs) && cached.docs.length) {
                    list.innerHTML = `<p class="text-gray-500 text-center mb-4">顯示上次載入的 ${cached.docs.length} 筆（更新中…）</p>`;
                    renderDocs(list, cached.docs);
                } else {
                    list.innerHTML = '<p class="text-gray-500 text-center">載入中...</p>';
                }
                empty.classList.add('hidden');
                lastDoc = null;
            }

            if (loading) return;
            loading = true;

            try {
                const parts = [
                    window.collection(window.db, currentTab),
                    window.where("username", "==", currentUsername),
                    window.orderBy("timestamp", "desc"),
                    window.limit(PAGE)
                ];
                if (append && lastDoc) parts.push(startAfter(lastDoc));

                const snap = await window.getDocs(window.query(...parts));
                const docs = docsFromSnapshot(snap);

                if (snap.docs.length) lastDoc = snap.docs[snap.docs.length - 1];

                if (!append) {
                    list.innerHTML = '';
                    const note = document.createElement('p');
                    note.className = 'text-gray-500 text-center mb-4';
                    note.textContent = docs.length
                        ? `顯示最新 ${docs.length} 筆${docs.length === PAGE ? '（可繼續載入更舊的記錄）' : ''}`
                        : '';
                    if (docs.length) list.appendChild(note);
                }

                if (docs.length === 0 && !append) {
                    empty.classList.remove('hidden');
                    list.innerHTML = '';
                    loading = false;
                    return;
                }
                empty.classList.add('hidden');

                const holder = document.createElement('div');
                holder.className = 'space-y-4';
                renderDocs(holder, docs);
                while (holder.firstChild) list.appendChild(holder.firstChild);

                if (!append) writeCache(currentUsername, currentTab, docs);
                addMoreButton(list, snap.docs.length);
            } catch (e) {
                const msg = String(e && e.message || e);
                const linkMatch = msg.match(/https:\/\/console\.firebase\.google\.com\/[^\s]+/);
                if (linkMatch || /index/i.test(msg)) {
                    // 索引未建立：先照舊方法（分頁掃描）拿到資料，唔會令家長乜都睇唔到
                    try {
                        const docs = await legacyFetchAll();
                        list.innerHTML = '';
                        const banner = document.createElement('div');
                        banner.className = 'bg-amber-50 border-2 border-amber-400 rounded-2xl p-4 text-amber-900 mb-3';
                        banner.innerHTML = '<p class="font-bold">⚡ 想載入得更快？建立一次性索引（約 1-2 分鐘）：' +
                            `<a class="underline break-all" target="_blank" href="${linkMatch ? linkMatch[0] : INDEX_URL}">按此建立</a>` +
                            '。建立後此頁只需 1 次查詢（約 0.7 秒）。</p>';
                        list.appendChild(banner);
                        if (docs.length === 0) {
                            empty.classList.remove('hidden');
                        } else {
                            empty.classList.add('hidden');
                            const note = document.createElement('p');
                            note.className = 'text-gray-500 text-center mb-4';
                            note.textContent = `共 ${docs.length} 筆記錄，顯示最新 ${Math.min(docs.length, 200)} 筆`;
                            list.appendChild(note);
                            const holder = document.createElement('div');
                            holder.className = 'space-y-4';
                            renderDocs(holder, docs.slice(0, 200));
                            while (holder.firstChild) list.appendChild(holder.firstChild);
                            writeCache(currentUsername, currentTab, docs.slice(0, 200));
                        }
                    } catch (e2) {
                        list.innerHTML = `<p class="text-red-500">載入失敗：${String(e2 && e2.message || e2)}</p>`;
                        console.error(e2);
                    }
                } else {
                    list.innerHTML = `<p class="text-red-500">載入失敗：${msg}</p>`;
                }
                console.error(e);
            } finally {
                loading = false;
            }
        };

        // 舊方法（無索引時後備）：分頁掃描全部，再在瀏覽器排序
        async function legacyFetchAll() {
            const PAGE_SIZE = 300;
            let cursor = null, all = [];
            for (let page = 0; page < 40; page++) {
                const parts = [
                    window.collection(window.db, currentTab),
                    window.where("username", "==", currentUsername),
                    window.limit(PAGE_SIZE)
                ];
                if (cursor) parts.push(startAfter(cursor));
                const snap = await window.getDocs(window.query(...parts));
                all = all.concat(snap.docs.map(d => ({ id: d.id, ...d.data() })));
                if (snap.docs.length < PAGE_SIZE) break;
                cursor = snap.docs[snap.docs.length - 1];
            }
            all.sort((a, b) => String(b.timestamp || "").localeCompare(String(a.timestamp || "")));
            return all;
        }

        function renderTestLog(list, id, data) {
            const div = document.createElement('div');
            div.className = 'bg-white rounded-2xl p-6 shadow-md border-l-8 border-indigo-400';
            div.innerHTML = `
                <div class="flex justify-between items-start mb-3">
                    <span class="text-xs text-gray-400">${id}</span>
                    <span class="text-xs text-gray-400">${data.timestamp || 'N/A'}</span>
                </div>
                <p class="text-xl font-bold text-slate-800 mb-2">${data.test || '未知試卷'}</p>
                <p class="text-lg text-indigo-600 font-bold">
                    ${data.timespend ? `用時：<strong>${data.timespend}</strong>` : `<span class="text-emerald-500">✨ 已進入練習</span>`}
                </p>
            `;
            list.appendChild(div);
        }

        function renderIncorrectLog(list, id, data) {
            const div = document.createElement('div');
            div.className = 'bg-white rounded-2xl p-6 shadow-md border-l-8 border-red-400';
            const blanks = Array.isArray(data.blanks) ? data.blanks : null;
            let bodyHtml;
            if (blanks && blanks.length) {
                // 新格式：一題一份文件，內含逐格明細（記錄量少、但仍然逐格顯示）
                bodyHtml = '<div class="space-y-2 mt-1">' + blanks.map(b => `
                    <div class="flex flex-wrap items-baseline gap-x-6 gap-y-1 text-lg">
                        <span class="text-slate-500 font-bold min-w-[8.5rem]">${b.label || '空格'}</span>
                        <span class="text-green-600">正確答案：<strong>${b.correctAnswer ?? 'N/A'}</strong></span>
                        <span class="text-red-500">學生答案：<strong>${b.studentAnswer ?? 'N/A'}</strong></span>
                    </div>`).join('') + '</div>';
            } else {
                bodyHtml = `
                    <div class="flex gap-8 text-lg">
                        <span class="text-green-600">正確答案：<strong>${data.correctAnswer ?? 'N/A'}</strong></span>
                        <span class="text-red-500">學生答案：<strong>${data.studentAnswer ?? 'N/A'}</strong></span>
                    </div>`;
            }
            div.innerHTML = `
                <div class="flex justify-between items-start mb-3">
                    <span class="text-xs text-gray-400">${id}</span>
                    <span class="text-xs text-gray-400">${data.timestamp || 'N/A'}</span>
                </div>
                <p class="text-xl font-bold text-slate-800 mb-2">題目：${data.question || 'N/A'}</p>
                ${bodyHtml}
            `;
            list.appendChild(div);
        }

        loadLogs();
    </script>
</body>
</html>
