<!DOCTYPE html>
<html lang="zh-HK">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🚀 二位數除以單位數 - 直式商數特訓</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module" src="auth.js"></script>
    <style>
        :root {
            --primary: #4A90E2;
            --secondary: #FFD166;
            --success: #06D6A0;
            --danger: #EF476F;
            --dark: #073B4C;
            --bg: #F8F9FA;
        }

        body {
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'Microsoft JhengHei', sans-serif;
            background-color: var(--bg);
            color: var(--dark);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 800px;
            width: 100%;
            background: white;
            padding: 30px;
            border-radius: 24px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
            border: 4px solid var(--primary);
        }

        h1 {
            text-align: center;
            color: var(--primary);
            font-size: 2.2rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px #E1F5FE;
        }

        .intro-box {
            background-color: #E3F2FD;
            padding: 15px 20px;
            border-radius: 16px;
            font-size: 1.2rem;
            line-height: 1.6;
            margin-bottom: 30px;
            border-left: 6px solid var(--primary);
        }

        .control-panel {
            text-align: center;
            margin-bottom: 20px;
        }

        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 28px;
            font-size: 1.2rem;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: all 0.2s;
            font-weight: bold;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
        }

        .btn-purple {
            background-color: #8A2BE2;
        }

        .btn-green {
            background-color: var(--success);
            margin-top: 15px;
        }

        .quiz-section {
            background: #FFF9E6;
            border: 3px solid #FFB703;
            border-radius: 20px;
            padding: 25px;
        }

        .quiz-card {
            background: white;
            padding: 20px;
            border-radius: 16px;
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
            border-left: 5px solid var(--secondary);
        }

        .quiz-q {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--dark);
            margin-bottom: 15px;
            border-bottom: 2px dashed #ccc;
            padding-bottom: 10px;
        }

        .step-row {
            display: flex;
            align-items: center;
            font-size: 1.3rem;
            margin-bottom: 12px;
        }

        .step-label {
            width: 250px;
            font-weight: bold;
            color: #555;
        }

        .step-tens {
            color: var(--primary);
        }

        .step-ones {
            color: #FB8500;
        }

        .step-rem {
            color: var(--danger);
        }

        .quiz-input {
            font-size: 1.3rem;
            padding: 8px;
            width: 120px;
            text-align: center;
            border: 3px solid #ddd;
            border-radius: 10px;
            margin-left: 10px;
            transition: border-color 0.3s;
        }

        .quiz-input:focus {
            outline: none;
            border-color: var(--primary);
        }

        .input-correct {
            border-color: var(--success);
            background-color: #E8F5E9;
            color: var(--success);
            font-weight: bold;
        }

        .input-wrong {
            border-color: var(--danger);
            background-color: #FFEBEE;
        }

        .feedback {
            font-size: 1.1rem;
            font-weight: bold;
            margin-top: 15px;
            padding: 10px;
            border-radius: 8px;
            display: none;
        }

        .feedback-success {
            background: #E8F5E9;
            color: var(--success);
        }

        .feedback-error {
            background: #FFEBEE;
            color: var(--danger);
        }
    </style>
</head>

<body>
    <a href="index.html#year3" style="position: fixed; top: 20px; left: 20px; background: #4A90E2; color: white; padding: 10px 20px; border-radius: 50px; text-decoration: none; font-weight: bold; box-shadow: 0 4px 6px rgba(0,0,0,0.1); z-index:1000;">← Go Back</a>

    <div class="container">
        <h1>🚀 二位數除以單位數 - 直式商數特訓</h1>

        <div class="intro-box">
            親愛的小探險家！直式除法需要我們從<b>高位（十位）開始動腦筋</b>。<br>
            這裏有 5 個精心準備的除法任務，請幫忙找出商的「十位數」、「個位數」和最後的「餘數」吧！
        </div>

        <div class="control-panel">
            <button class="btn btn-purple" onclick="generateQuizzes()">🎲 產生 5 題全新任務</button>
        </div>

        <div class="quiz-section">
            <div id="quiz-container">
                </div>
            <div id="result-box" style="display:none; margin-top:18px; padding:16px; border-radius:14px; font-size:1.05rem; font-weight:700; text-align:center;"></div>
            <button id="submit-btn" class="btn btn-green" style="width:100%; margin-top:18px; display:none;" onclick="submitAll()">✅ 完成全部 5 題，提交答案</button>
        </div>
    </div>

    <script>
        let currentQuizzes = [];
        // ---- no-duplicate drawing (2026-11-27) -------------------------------------
        // Old code drew each of the 5 questions independently (Math.random() per question),
        // so the same division pair could easily appear twice in one set — and again right
        // after pressing "產生 5 題全新任務". Now we enumerate every legal pair once,
        // shuffle it, and take 5 that were not used in the previous set.
        // Legal pair: divisor 3-9, dividend 10-99, two-digit quotient, non-zero remainder,
        // dividend not a multiple of 5 or 10.
        const PAIR_POOL = (function () {
            const pool = [];
            for (let d = 3; d <= 9; d++) {
                for (let n = 10; n <= 99; n++) {
                    const q = Math.floor(n / d);
                    if (q > 10 && n % d > 0 && n % 5 !== 0 && n % 10 !== 0) pool.push([n, d]);
                }
            }
            return pool;
        })();
        let lastSetKeys = new Set();   // "dividend/divisor" strings from the previous round

        function shuffleCopy(arr) {
            const a = arr.slice();
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        function drawUniquePairs(count) {
            const key = ([n, d]) => n + '/' + d;
            // first pass: pairs not used last round, and no repeated dividend inside the set
            let picked = [], usedDividend = new Set(), usedKey = new Set();
            for (const p of shuffleCopy(PAIR_POOL)) {
                if (picked.length === count) break;
                if (usedKey.has(key(p)) || usedDividend.has(p[0])) continue;
                if (lastSetKeys.has(key(p))) continue;
                picked.push(p); usedKey.add(key(p)); usedDividend.add(p[0]);
            }
            // fallback (only if the excluded set is huge): allow last round's pairs,
            // but still never repeat one inside the same set
            if (picked.length < count) {
                for (const p of shuffleCopy(PAIR_POOL)) {
                    if (picked.length === count) break;
                    if (usedKey.has(key(p)) || usedDividend.has(p[0])) continue;
                    picked.push(p); usedKey.add(key(p)); usedDividend.add(p[0]);
                }
            }
            lastSetKeys = new Set(picked.map(key));
            return picked;
        }

        function generateQuizzes() {
            const container = document.getElementById('quiz-container');
            if (!container) return;

            container.innerHTML = '';
            currentQuizzes = [];

            const pairs = drawUniquePairs(5);

            for (let i = 0; i < pairs.length; i++) {
                const dividend = pairs[i][0];
                const divisor = pairs[i][1];
                const quotient = Math.floor(dividend / divisor);
                const remainder = dividend % divisor;

                let q_tens = Math.floor(quotient / 10);
                let q_ones = quotient % 10;

                currentQuizzes.push({
                    dividend: dividend,
                    divisor: divisor,
                    ans1: q_tens,
                    ans2: q_ones,
                    ans3: remainder
                });

                const card = document.createElement('div');
                card.className = 'quiz-card';
                card.innerHTML = `
                    <div class="quiz-q">任務 ${i + 1}： 計算 ${dividend} ÷ ${divisor}</div>
                    
                    <div class="step-row">
                        <div class="step-label step-tens">第一部分 (商的十位數) =</div>
                        <input type="number" id="q${i}-p1" class="quiz-input" placeholder="十位商">
                    </div>
                    
                    <div class="step-row">
                        <div class="step-label step-ones">第二部分 (商的個位數) =</div>
                        <input type="number" id="q${i}-p2" class="quiz-input" placeholder="個位商">
                    </div>
                    
                    <div class="step-row">
                        <div class="step-label step-rem">第三部分 (最終的餘數) =</div>
                        <input type="number" id="q${i}-p3" class="quiz-input" placeholder="餘數">
                    </div>

                    <div id="fb-${i}" class="feedback"></div>
                `;
                container.appendChild(card);
            }
            // 一次過提交（跟 math18 做法）：唔再逐題檢查，學生做完 5 題才按提交
            submitted = false;
            setStartTime = Date.now();
            if (window.floatingTimer) window.floatingTimer.reset();   // 新一輪：計時重新開始
            const rb = document.getElementById('result-box');
            if (rb) { rb.style.display = 'none'; rb.innerHTML = ''; }
            const sb = document.getElementById('submit-btn');
            if (sb) {
                sb.style.display = 'block';
                sb.disabled = false;
                sb.textContent = '✅ 完成全部 5 題，提交答案';
                sb.onclick = function () { submitAll(); };
            }
        }

        // ===== 提交層（跟 math18.html：做完全部才提交，一次過記錄）=====
        let submitted = false;
        let setStartTime = Date.now();
        const TEST_NAME = '➗ 二位數除以單位數（直式商數）';
        const PENDING_KEY = 'math11_pending_logs';
        const CELL_LABEL = { p1: '商的十位', p2: '商的個位', p3: '餘數' };
        let saveWarned = false;

        function hktNow() {
            const now = new Date();
            const hkt = new Date(now.getTime() + 8 * 60 * 60 * 1000);
            return hkt.toISOString().replace('T', ' ').slice(0, 19);
        }
        function getSafeUsername() {
            try { return (window.getUsername && window.getUsername()) || '訪客'; }
            catch (e) { return '訪客'; }
        }
        // auth.js 係 module，可能比本頁 script 遲載入：要等，唔可以「冇就當成功」
        function fbReady() {
            // 細路版冇 Firebase Auth（用戶名嚟自 cookie），所以只等 SDK 就緒；
            // 商業版（alan-math-2）才需要等 bizAuth.user。
            return !!(window.db && window.addDoc && window.collection);
        }
        function waitForFb(ms) {
            const limitMs = ms || 6000;
            return new Promise(function (resolve) {
                if (fbReady()) return resolve(true);
                const t0 = Date.now();
                const iv = setInterval(function () {
                    if (fbReady()) { clearInterval(iv); resolve(true); }
                    else if (Date.now() - t0 > limitMs) { clearInterval(iv); resolve(false); }
                }, 250);
            });
        }
        function showSaveWarning() {
            if (saveWarned || document.getElementById('save-warning')) return;
            saveWarned = true;
            const bar = document.createElement('div');
            bar.id = 'save-warning';
            bar.style.cssText = 'position:fixed;bottom:0;left:0;right:0;z-index:300;background:#fef3c7;border-top:4px solid #f59e0b;color:#78350f;padding:12px;font-weight:700;text-align:center;';
            bar.innerHTML = (location.protocol === 'file:'
                ? '⚠️ 以檔案方式開啟會封鎖 Firebase，這次成績<b>不會</b>存入學習記錄。請用 http://localhost:3000/math11.html 再做一次。'
                : '⚠️ 這次成績<b>未能</b>存入學習記錄（Firebase 未載入或寫入失敗）。已暫存本機，下次用正常網頁開啟會自動補寫。');
            document.body.appendChild(bar);
        }
        function queuePending(coll, data) {
            try {
                const q = JSON.parse(localStorage.getItem(PENDING_KEY) || '[]');
                q.push({ coll: coll, data: data });
                localStorage.setItem(PENDING_KEY, JSON.stringify(q));
            } catch (e) { /* localStorage 被封鎖都冇辦法 */ }
        }
        async function flushPending() {
            if (!fbReady()) return;
            let q = [];
            try { q = JSON.parse(localStorage.getItem(PENDING_KEY) || '[]'); } catch (e) { q = []; }
            if (!q.length) return;
            const keep = [];
            for (const item of q) {
                try { await window.addDoc(window.collection(window.db, item.coll), item.data); }
                catch (e) { keep.push(item); }
            }
            try { localStorage.setItem(PENDING_KEY, JSON.stringify(keep)); } catch (e) {}
        }
        async function writeDoc(coll, data) {
            if (await waitForFb(6000)) {
                try {
                    await window.addDoc(window.collection(window.db, coll), data);
                    return true;
                } catch (e) {
                    console.error('Firebase write failed:', coll, e);
                    queuePending(coll, data);
                    showSaveWarning();
                    return false;
                }
            }
            queuePending(coll, data);
            showSaveWarning();
            return false;
        }

        async function submitAll() {
            if (submitted) return;
            submitted = true;
            const sb = document.getElementById('submit-btn');
            if (sb) { sb.disabled = true; sb.style.display = 'none'; }

            let score = 0;
            const wrongRecords = [];

            currentQuizzes.forEach(function (q, i) {
                const ans = [q.ans1, q.ans2, q.ans3];
                const keys = ['p1', 'p2', 'p3'];
                const blanks = [];
                let allCorrect = true;

                keys.forEach(function (k, idx) {
                    const inp = document.getElementById('q' + i + '-' + k);
                    if (!inp) return;
                    const raw = String(inp.value).trim();
                    const isRight = raw !== '' && Number(raw) === ans[idx];
                    inp.disabled = true;
                    inp.classList.add(isRight ? 'input-correct' : 'input-wrong');
                    if (!isRight) {
                        allCorrect = false;
                        blanks.push({ label: CELL_LABEL[k], correctAnswer: String(ans[idx]), studentAnswer: raw || '未填' });
                    }
                });

                if (allCorrect) score++;

                const fb = document.getElementById('fb-' + i);
                if (fb) {
                    fb.style.display = 'block';
                    fb.className = 'feedback ' + (allCorrect ? 'feedback-success' : 'feedback-error');
                    fb.innerHTML = allCorrect ? '✅ 這題全對！'
                        : '❌ 這題有格答錯（正確：商 ' + Math.floor(q.dividend / q.divisor) + ' 餘 ' + (q.dividend % q.divisor) + '）';
                }

                if (blanks.length) {
                    wrongRecords.push({
                        question: '第' + (i + 1) + '題 ' + q.dividend + ' ÷ ' + q.divisor +
                                  '（商 ' + Math.floor(q.dividend / q.divisor) + ' 餘 ' + (q.dividend % q.divisor) + '）',
                        blanks: blanks
                    });
                }
            });

            const totalSec = Math.max(1, Math.round((Date.now() - setStartTime) / 1000));
            if (window.floatingTimer) window.floatingTimer.stop();    // 提交後停止計時
            await writeDoc('test-log', {
                username: getSafeUsername(),
                test: TEST_NAME,
                score: score * 20,
                timespend: Math.floor(totalSec / 60) + '分' + (totalSec % 60) + '秒',
                timestamp: hktNow()
            });

            for (const r of wrongRecords) {
                await writeDoc('incorrect-log', {
                    username: getSafeUsername(),
                    question: r.question,
                    timestamp: hktNow(),
                    blanks: r.blanks,
                    correctAnswer: r.blanks.map(function (b) { return b.correctAnswer; }).join(', '),
                    studentAnswer: r.blanks.map(function (b) { return b.studentAnswer; }).join(', ')
                });
            }

            const rb = document.getElementById('result-box');
            if (rb) {
                rb.style.display = 'block';
                rb.style.background = score === 5 ? '#e8f7ee' : (score >= 3 ? '#fff7e6' : '#fdeceb');
                rb.innerHTML = '成績：' + score + ' / 5（' + (score * 20) + ' 分）' +
                    (score === 5 ? ' 🎉 全部正確！'
                                 : (wrongRecords.length ? '　已記錄 ' + wrongRecords.length + ' 題錯處到「錯誤記錄」' : ''));
            }
            if (sb) {
                sb.style.display = 'block';
                sb.disabled = false;
                sb.textContent = '🎲 再來 5 題';
                sb.onclick = function () { generateQuizzes(); };
            }
        }

        function updateInputStyle(inputElement, isCorrect, value) {
            if (isNaN(value)) {
                inputElement.className = 'quiz-input';
                return;
            }
            if (isCorrect) {
                inputElement.className = 'quiz-input input-correct';
            } else {
                inputElement.className = 'quiz-input input-wrong';
            }
        }

        // 獨立於生命週期的安全初始化，確保雙擊本地檔案也能立即看到題目
        let entranceLogged = false;
        function initQuiz() {
            if (!document.querySelector('.quiz-card')) generateQuizzes();
        }

        // 確保在各種加載模式下都能被呼叫
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initQuiz);
        } else {
            initQuiz();
        }

        window.onUserSet = function () {
            flushPending();
            if (!entranceLogged) {
                entranceLogged = true;
                logEntrance();
            }
        };

        async function logEntrance() {
            // 未拿到真正用戶名就唔好寫「訪客」入場記錄
            const who = getSafeUsername();
            if (!who || who === '訪客') return;
            await writeDoc('test-log', {
                username: who,
                test: TEST_NAME,
                timestamp: hktNow(),
                status: 'entered'
            });
        }
    </script>
</body>

</html>
