<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>小三數學：秒與24小時報時制（圖形化時鐘練習）</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- 嘗試載入 auth.js，若本地測試失敗也不會影響主程式運行 -->
  <script type="module" src="auth.js" onerror="console.warn('auth.js 未載入，以離線/訪客模式運行。');"></script>
  <style>
    /* 隱藏數字輸入框的上下微調箭頭 */
    input[type=number]::-webkit-inner-spin-button, 
    input[type=number]::-webkit-outer-spin-button { 
      -webkit-appearance: none; 
      margin: 0; 
    }
    input[type=number] {
      -moz-appearance: textfield;
    }

    /* ===== 加大字體（小三學生閱讀用，Alan 2026-10-22）===== */
    /* 解題步驟（綠框／紅框內文字）：Alan 覺得 48px 太大，改回 24px */
    .clock-explain { font-size: 1.5rem; line-height: 1.7; color: #0f172a; }
    .clock-explain .step-label { font-size: 1.6rem; font-weight: 800; color: #4338ca; }
    /* 綠／紅底色本來被 bg-white/90 蓋過，這裡強制顯示，讓學生一眼分得出對錯 */
    .clock-explain.bg-green-50 { background-color: #dcfce7 !important; border-color: #16a34a !important; }
    .clock-explain.bg-red-50   { background-color: #fee2e2 !important; border-color: #dc2626 !important; }
    /* 題目文字亦要夠大 */
    #questions-container .q-prompt { font-size: 1.25rem; line-height: 1.7; }
  </style>
</head>
<body class="bg-indigo-50 min-h-screen py-8 px-4 font-sans text-slate-800">

  <!-- 返回主頁按鈕 -->
  <a href="index.html#year3" style="position: fixed; top: 20px; left: 20px; background: #4F46E5; color: white; padding: 10px 20px; border-radius: 50px; text-decoration: none; font-weight: bold; box-shadow: 0 4px 6px rgba(0,0,0,0.1); z-index:1000;">← Go Back</a>

  <div class="max-w-4xl mx-auto bg-white rounded-2xl shadow-xl border-4 border-indigo-300 p-6 md:p-10">
    
    <!-- 標頭資訊區 -->
    <header class="border-b-2 border-dashed border-indigo-200 pb-6 mb-8 text-center">
      <div class="inline-block bg-indigo-500 text-white text-xs md:text-sm font-bold px-4 py-1 rounded-full mb-2">
        小學三年級數學科研習練習
      </div>
      <h1 class="text-2xl md:text-4xl font-extrabold text-slate-800 tracking-tight">
        單元四：秒和24小時報時制（圖形互動練習）
      </h1>
      <p class="text-slate-500 text-sm md:text-base mt-2">
        請仔細觀察 SVG 時鐘圖形與題目，將答案填入輸入框或選擇正確選項。完成後點擊頁尾的「交卷並對答案」。
      </p>
    </header>

    <!-- 題目容器 -->
    <form id="quiz-form" class="space-y-8">
      <div id="questions-container" class="space-y-8">
        <!-- 題目由 JavaScript 動態生成 -->
      </div>

      <!-- 操作按鈕區 -->
      <div class="pt-6 border-t-2 border-indigo-100 flex flex-col sm:flex-row items-center justify-between gap-4">
        <button type="button" onclick="generateQuiz()" class="w-full sm:w-auto px-6 py-3 bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold rounded-xl transition flex items-center justify-center gap-2">
          🔄 生成新練習
        </button>
        <button type="button" id="submit-btn" onclick="checkAnswers()" class="w-full sm:w-auto px-8 py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl shadow-lg transition flex items-center justify-center gap-2">
          ✏️ 交卷並對答案
        </button>
      </div>
    </form>

    <!-- 成績與解析展示區 -->
    <div id="result-board" class="hidden mt-8 p-6 bg-slate-50 rounded-xl border-2 border-slate-200">
      <div class="text-center mb-6">
        <span class="text-sm font-semibold text-slate-500">練習得分</span>
        <div id="score-text" class="text-4xl font-black text-indigo-600 my-1">0 / 10</div>
        <p id="feedback-text" class="text-slate-600 font-medium"></p>
      </div>
    </div>

  </div>

  <script>
    function getRandomInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    // 24 小時制 →「上午／下午 X 時 Y 分」（12:xx 一律寫「下午」，同課本一致）
    function fmt12h(h24, m) {
      const period = h24 < 12 ? '上午' : '下午';
      let h = h24 % 12;
      if (h === 0) h = 12;
      return `${period} ${h} 時 ${m} 分`;
    }

    // 把正解同干擾項洗牌後配成 A/B/C/D，回傳 { options, ans }
    // 注意：干擾項必須最少 3 個不重複，否則會有少過 4 個選項
    function buildOptions(correct, distractors) {
      const pool = [correct];
      distractors.forEach(d => { if (!pool.includes(d)) pool.push(d); });
      if (pool.length < 4) {
        // 保險：萬一干擾項撞正解，補上帶「元／時」字尾的變體湊夠 4 個
        let n = 2;
        while (pool.length < 4) { pool.push(correct + '（' + (n++) + '）'); }
      }
      for (let i = pool.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        const t = pool[i]; pool[i] = pool[j]; pool[j] = t;
      }
      const letters = ['A', 'B', 'C', 'D'];
      const options = pool.slice(0, 4).map((v, i) => ({ label: `${letters[i]}. ${v}`, val: letters[i] }));
      return { options: options, ans: letters[pool.indexOf(correct)] };
    }

    // ===== SVG 繪圖工具：單一精緻時鐘 (對應 Chap8 / Chap9) =====
    function drawClock(hour, minute, label = "") {
      const cx = 100, cy = 100, r = 85;
      let ticks = '';
      for (let i = 0; i < 60; i++) {
        const angle = (i * 6 - 90) * (Math.PI / 180);
        const isHour = i % 5 === 0;
        const outerR = r - 5;
        const innerR = isHour ? r - 14 : r - 9;
        const x1 = cx + outerR * Math.cos(angle);
        const y1 = cy + outerR * Math.sin(angle);
        const x2 = cx + innerR * Math.cos(angle);
        const y2 = cy + innerR * Math.sin(angle);
        ticks += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${isHour ? '#334155' : '#94a3b8'}" stroke-width="${isHour ? 2 : 1}"/>`;
      }
      for (let i = 1; i <= 12; i++) {
        const angle = (i * 30 - 90) * (Math.PI / 180);
        const tx = cx + (r - 27) * Math.cos(angle);
        const ty = cy + (r - 27) * Math.sin(angle);
        ticks += `<text x="${tx}" y="${ty + 7}" font-size="19.2" text-anchor="middle" font-weight="bold" fill="#1e293b">${i}</text>`;
      }

      const hAngle = ((hour % 12) + minute / 60) * 30 - 90;
      const mAngle = minute * 6 - 90;

      const hx = cx + 45 * Math.cos(hAngle * Math.PI / 180);
      const hy = cy + 45 * Math.sin(hAngle * Math.PI / 180);
      const mx = cx + 65 * Math.cos(mAngle * Math.PI / 180);
      const my = cy + 65 * Math.sin(mAngle * Math.PI / 180);

      const labelSize = label.length > 14 ? 16 : (label.length > 10 ? 20 : 26);
      let labelHtml = label ? `<text x="${cx}" y="215" font-size="${labelSize}" font-weight="bold" text-anchor="middle" fill="#4f46e5">${label}</text>` : '';

      return `
      <svg viewBox="0 0 200 240" class="w-full max-w-[288px] mx-auto my-2" role="img" aria-label="時鐘圖形">
        <circle cx="${cx}" cy="${cy}" r="${r}" fill="#ffffff" stroke="#475569" stroke-width="4"/>
        ${ticks}
        <line x1="${cx}" y1="${cy}" x2="${hx}" y2="${hy}" stroke="#0f172a" stroke-width="5" stroke-linecap="round"/>
        <line x1="${cx}" y1="${cy}" x2="${mx}" y2="${my}" stroke="#2563eb" stroke-width="3.5" stroke-linecap="round"/>
        <circle cx="${cx}" cy="${cy}" r="5" fill="#0f172a"/>
        ${labelHtml}
      </svg>`;
    }

    // ===== SVG 繪圖工具：前後兩個鐘面比較 =====
    function drawClockPair(h1, m1, label1, h2, m2, label2) {
      return `
      <div class="flex flex-col sm:flex-row items-center justify-center gap-4 my-3 bg-white p-4 rounded-xl border border-indigo-100 shadow-sm">
        <div class="text-center">
          ${drawClock(h1, m1, label1)}
        </div>
        <div class="text-3xl font-black text-indigo-500 animate-pulse">➔</div>
        <div class="text-center">
          ${drawClock(h2, m2, label2)}
        </div>
      </div>`;
    }

    // SVG 模擬電子秒錶
    function drawDigitalStopwatch(seconds) {
      const secStr = seconds < 10 ? '0' + seconds : seconds;
      return `
      <svg viewBox="0 0 220 80" class="w-full max-w-[320px] mx-auto my-3" role="img" aria-label="電子秒錶">
        <rect x="10" y="10" width="200" height="60" rx="10" fill="#1e293b" stroke="#64748b" stroke-width="3"/>
        <rect x="25" y="20" width="170" height="40" rx="5" fill="#0284c7" />
        <text x="110" y="48" font-family="monospace" font-size="30" font-weight="bold" fill="#ffffff" text-anchor="middle">00:${secStr}</text>
      </svg>`;
    }

    // ===== 秒針版本（Chap8）：紅色秒針 = 最長最幼的針 =====
    function drawClockSec(hour, minute, second, label = "") {
      const cx = 100, cy = 100;
      const sAngle = second * 6 - 90;
      const sx = cx + 72 * Math.cos(sAngle * Math.PI / 180);
      const sy = cy + 72 * Math.sin(sAngle * Math.PI / 180);
      const hand = `<line x1="${cx}" y1="${cy}" x2="${sx}" y2="${sy}" stroke="#dc2626" stroke-width="1.5" stroke-linecap="round"/>`;
      return drawClock(hour, minute, label).replace(
        '<circle cx="100" cy="100" r="5" fill="#0f172a"/>',
        hand + '\n        <circle cx="100" cy="100" r="5" fill="#0f172a"/>'
      );
    }

    // 兩個鐘面（含秒針）比較：用來看「經過了多少秒」
    function drawClockPairSec(h1, m1, s1, label1, h2, m2, s2, label2) {
      return `
      <div class="flex flex-col sm:flex-row items-center justify-center gap-4 my-3 bg-white p-4 rounded-xl border border-amber-100 shadow-sm">
        <div class="text-center">${drawClockSec(h1, m1, s1, label1)}</div>
        <div class="text-3xl font-black text-amber-500 animate-pulse">➔</div>
        <div class="text-center">${drawClockSec(h2, m2, s2, label2)}</div>
      </div>`;
    }

    let quizData = [];
    let isSubmitted = false;
    let quizStartTime = null;

    function generateQuiz() {
      quizData = [];
      isSubmitted = false;
      quizStartTime = Date.now();
      const container = document.getElementById('questions-container');
      if (!container) return;
      container.innerHTML = '';
      const resultBoard = document.getElementById('result-board');
      if (resultBoard) resultBoard.classList.add('hidden');

      const submitBtn = document.getElementById('submit-btn');
      if (submitBtn) submitBtn.classList.remove('hidden');

      // -------------------------------------------------------------
      // 題型 1（Chap8 ⑤＋③）：秒針走 1 圈，分針走了多少小格？
      //   要串連：秒針 1 圈 = 60 秒 = 1 分鐘；分針 1 小格 = 1 分鐘
      // -------------------------------------------------------------
      quizData.push({
        id: 1, type: 'select', title: '秒針與分針的關係',
        prompt: `秒針走 1 圈（即 60 小格），回到 12；同一時間，分針由 12 走到 1。<br>${drawClockPairSec(12, 0, 0, '開始 12:00:00', 12, 1, 0, '1 分鐘後 12:01:00')}<br>那麼秒針走 1 圈，分針走了多少小格？`,
        options: ['1 小格', '5 小格', '12 小格', '60 小格'],
        ans: '1 小格',
        explain: `秒針走 1 圈 ＝ 60 秒 ＝ 1 分鐘；而分針走 1 小格 就是 1 分鐘。所以分針只走了 1 小格。`
      });

      // -------------------------------------------------------------
      // 題型 2（Chap8 ⑤ 逆算）：秒 換算成「分 + 秒」
      // -------------------------------------------------------------
      const totalSec = getRandomInt(14, 49) * 5 + getRandomInt(1, 4);  // 71..249 秒，非 5 的倍數
      const convM = Math.floor(totalSec / 60);
      const convS = totalSec % 60;
      quizData.push({
        id: 2, type: 'multi-input', title: '秒換算成分與秒',
        prompt: `${totalSec} 秒 ＝ 多少分多少秒？（提示：1 分鐘 ＝ 60 秒，先算有幾個 60）`,
        inputs: [
          { suffix: ' 分', key: 'm', ans: convM.toString() },
          { suffix: ' 秒', key: 's', ans: convS.toString() }
        ],
        explain: `${totalSec} ÷ 60 ＝ ${convM} 餘 ${convS}，即 ${convM} × 60 ＝ ${convM * 60} 秒，還剩 ${totalSec} − ${convM * 60} ＝ ${convS} 秒。所以 ${totalSec} 秒 ＝ ${convM} 分 ${convS} 秒。`
      });

      // -------------------------------------------------------------
      // 題型 3（Chap8 ⑦⑧⑩⑪ 加深）：兩鐘面相減，要跨過 1 分鐘
      // -------------------------------------------------------------
      const pH = getRandomInt(2, 6);
      const pM = getRandomInt(0, 9) * 5 + getRandomInt(0, 4);   // 0..49
      const pS = getRandomInt(7, 11) * 5;                        // 35,40,45,50,55
      const pDelta = getRandomInt(6, 16) * 5;                    // 30..80 秒
      const pTotal = pM * 60 + pS + pDelta;
      const pEndM = Math.floor(pTotal / 60) % 60;
      const pEndS = pTotal % 60;
      const pEndH = pH + Math.floor(pTotal / 3600);
      const crossMinute = (pS + pDelta) >= 60;
      const pad = n => (n < 10 ? '0' + n : n);
      quizData.push({
        id: 3, type: 'input', title: '看圖計算經過秒數（跨分鐘）',
        prompt: `觀察以下由開始到結束的鐘面（紅色是秒針），這項活動共進行了多少秒？<br>${drawClockPairSec(pH, pM, pS, `開始 ${pH}:${pad(pM)}:${pad(pS)}`, pEndH, pEndM, pEndS, `結束 ${pEndH}:${pad(pEndM)}:${pad(pEndS)}`)}`,
        suffix: ' 秒', ans: pDelta.toString(),
        explain: crossMinute
          ? `秒針由 ${pS} 秒走到 60 秒是 ${60 - pS} 秒（此時分針向前走 1 小格），再走到 ${pEndS} 秒是 ${pEndS} 秒，合共 ${60 - pS} ＋ ${pEndS} ＝ ${pDelta} 秒。`
          : `分針沒有移動，只有秒針由 ${pS} 秒走到 ${pEndS} 秒：${pEndS} − ${pS} ＝ ${pDelta} 秒。`
      });

      // -------------------------------------------------------------
      // 題型 4（Chap8 ⑨⑫ 加深）：比較兩個秒錶，求相差
      // -------------------------------------------------------------
      const swSlow = getRandomInt(20, 55);
      const swGap = getRandomInt(3, 15);
      const swFast = swSlow - swGap;
      quizData.push({
        id: 4, type: 'input', title: '比較兩個秒錶',
        prompt: `甲、乙兩人同時用秒錶計時，結果如下圖。乙比甲快，乙比甲少用了多少秒？<br>
          <div class="flex flex-col sm:flex-row items-center justify-center gap-4 my-2">
            <div class="text-center"><div class="text-base font-bold text-slate-700">甲</div>${drawDigitalStopwatch(swSlow)}</div>
            <div class="text-center"><div class="text-base font-bold text-slate-700">乙</div>${drawDigitalStopwatch(swFast)}</div>
          </div>`,
        suffix: ' 秒', ans: swGap.toString(),
        explain: `甲的秒錶是 00:${pad(swSlow)}，即 ${swSlow} 秒；乙是 00:${pad(swFast)}，即 ${swFast} 秒。相差 ${swSlow} − ${swFast} ＝ ${swGap} 秒，所以乙少用了 ${swGap} 秒。`
      });

      // -------------------------------------------------------------
      // 題型 5：給定開始鐘面與持續時間，求結束時間
      // -------------------------------------------------------------
      const sH = getRandomInt(1, 4);
      const sM = getRandomInt(10, 30);
      const addM = getRandomInt(25, 40);
      let targetM = sH * 60 + sM + addM;
      const targetH = Math.floor(targetM / 60);
      const targetMin = targetM % 60;
      quizData.push({
        id: 5, type: 'multi-input', title: '推算結束時間',
        prompt: `右面的鐘面顯示柏謙開始做功課的時間：<br>${drawClock(sH, sM, '開始做功課')}<br>他做了 ${addM} 分鐘功課，他在何時完成？`,
        inputs: [
          { suffix: ' 時', key: 'h', ans: targetH.toString() },
          { suffix: ' 分', key: 'm', ans: targetMin.toString() }
        ],
        explain: `開始時間是 ${sH}:${sM < 10 ? '0'+sM : sM}，加上 ${addM} 分鐘：${sM} + ${addM} = ${sM + addM} 分。若超過 60 分鐘則進位 1 小時，得出完成時間為 ${targetH} 時 ${targetMin} 分。`
      });

      // -------------------------------------------------------------
      // 題型 6：給定結束鐘面與耗時，求開始時間
      // -------------------------------------------------------------
      const eH = getRandomInt(6, 9);
      const eM = getRandomInt(35, 55);
      const subM = getRandomInt(15, 30);
      let origTotalM = eH * 60 + eM - subM;
      const origH = Math.floor(origTotalM / 60);
      const origMin = origTotalM % 60;
      quizData.push({
        id: 6, type: 'multi-input', title: '推算開始時間',
        prompt: `表姐表演完結時的鐘面如下：<br>${drawClock(eH, eM, '表演完成')}<br>她在舞台上表演了 ${subM} 分鐘，她在何時開始表演？`,
        inputs: [
          { suffix: ' 時', key: 'h', ans: origH.toString() },
          { suffix: ' 分', key: 'm', ans: origMin.toString() }
        ],
        explain: `完成時間為 ${eH}:${eM}，往前推算表演所用的 ${subM} 分鐘：${eM} − ${subM} = ${origMin} 分。因此開始時間是 ${origH} 時 ${origMin} 分。`
      });

      // -------------------------------------------------------------
      // 題型 7：24小時報時制與午膳/活動
      // -------------------------------------------------------------
      const arrH = getRandomInt(8, 10);
      const lunchH = 12;
      const stayedH = lunchH - arrH;
      quizData.push({
        id: 7, type: 'input', title: '逗留時間計算',
        prompt: `志文在上午 ${arrH} 時到達渡假村（對應鐘面 ${arrH}:00）。他在下午 ${lunchH} 時去吃午飯，他在渡假村已逗留了多少小時？<br>${drawClock(arrH, 0, '到達時間')} ${drawClock(lunchH, 0, '午飯時間')}`,
        suffix: ' 小時', ans: stayedH.toString(),
        explain: `由上午 ${arrH} 時至下午 ${lunchH} 時（12時）：${lunchH} − ${arrH} = ${stayedH} 小時。`
      });

      // -------------------------------------------------------------
      // 題型 8：足球比賽歷時
      // -------------------------------------------------------------
      quizData.push({
        id: 8, type: 'input', title: '比賽持續時間',
        prompt: `足球比賽在 11:02 am 開始，在 1:02 pm 結束。這場比賽一共長多少小時？`,
        suffix: ' 小時', ans: '2',
        explain: `由上午 11:02 至下午 1:02，時針走了一圈又多一點，共經過了 2 小時。`
      });

      // -------------------------------------------------------------
      // 題型 9：遲到與結束時間（每次重新抽：原定時間／遲到分鐘／講座長度）
      // -------------------------------------------------------------
      const q9StartH = getRandomInt(7, 10);
      const q9StartM = getRandomInt(0, 5) * 10;        // 0,10,20,30,40,50
      const q9Delay = getRandomInt(2, 5) * 5;         // 遲 10~25 分鐘
      const q9DurH = getRandomInt(2, 4);              // 講座 2~4 小時
      const q9StartAbs = q9StartH * 60 + q9StartM;
      const q9ActualAbs = q9StartAbs + q9Delay;
      const q9EndAbs = q9ActualAbs + q9DurH * 60;
      const correct9 = fmt12h(Math.floor(q9EndAbs / 60), q9EndAbs % 60);
      const forgotDelay = fmt12h(Math.floor((q9StartAbs + q9DurH * 60) / 60), (q9StartAbs + q9DurH * 60) % 60);
      const off30 = fmt12h(Math.floor((q9EndAbs + 30) / 60), (q9EndAbs + 30) % 60);
      const off60 = fmt12h(Math.floor((q9ActualAbs + (q9DurH + 1) * 60) / 60), (q9ActualAbs + (q9DurH + 1) * 60) % 60);
      const opts9 = buildOptions(correct9, [forgotDelay, off30, off60]);
      quizData.push({
        id: 9, type: 'select-text', title: '講座延遲與結束計算',
        prompt: `某講座原定在<b>${fmt12h(q9StartH, q9StartM)}</b>開始，但實際開始時間遲了 <b>${q9Delay} 分鐘</b>。講座進行了 <b>${q9DurH} 小時</b>，即講座在甚麼時間結束？`,
        options: opts9.options,
        ans: opts9.ans,
        explain: `實際開始時間：${q9StartM} 分 ＋ ${q9Delay} 分 ＝ ${q9ActualAbs % 60} 分，即 ${fmt12h(Math.floor(q9ActualAbs / 60), q9ActualAbs % 60)}。再加上 ${q9DurH} 小時，結束時間就是 <b>${correct9}</b>。`
      });

      // -------------------------------------------------------------
      // 題型 10：停車場計費（每次重新抽：收費／入場時間／泊車時長）
      // -------------------------------------------------------------
      const q10Rate1 = [20, 25, 30][getRandomInt(0, 2)];   // 首小時
      const q10Rate2 = [10, 15, 20][getRandomInt(0, 2)];   // 之後每半小時
      const q10InH = getRandomInt(11, 14);
      const q10InM = getRandomInt(1, 11) * 5;              // 5,10,…55（非整點）
      const q10HalfUnits = getRandomInt(2, 6);             // 泊 1.0~3.0 小時（每個半小時為 1 單位）
      const q10OutAbs = q10InH * 60 + q10InM + q10HalfUnits * 30;
      const q10OutH = Math.floor(q10OutAbs / 60), q10OutM = q10OutAbs % 60;
      const q10Extra = Math.max(0, q10HalfUnits - 2);      // 首 1 小時 = 2 個半小時
      const q10Fee = q10Rate1 + q10Extra * q10Rate2;
      const q10Hours = q10HalfUnits * 0.5;
      // 干擾項：由候選池中挑 3 個「一定唔等於正解、又互不相同」的數值
      const feeStr = v => v + ' 元';
      const q10Candidates = [q10Fee + q10Rate2, q10Fee + 2 * q10Rate2, q10Fee + 3 * q10Rate2,
                             q10Fee - q10Rate2, q10Fee + q10Rate1];
      const q10Wrong = [];
      for (const v of q10Candidates) {
        if (v > 0 && v !== q10Fee && !q10Wrong.includes(v)) q10Wrong.push(v);
        if (q10Wrong.length === 3) break;
      }
      const opts10 = buildOptions(feeStr(q10Fee), q10Wrong.map(feeStr));
      quizData.push({
        id: 10, type: 'select-text', title: '停車場收費應用題',
        prompt: `停車場收費：<b>首小時 $${q10Rate1}</b>，以後<b>每半小時 $${q10Rate2}</b>。<br>媽媽在 ${fmt12h(q10InH, q10InM)} 把車駛進停車場，在 ${fmt12h(q10OutH, q10OutM)} 駕車離開。媽媽共需付多少元？`,
        options: opts10.options,
        ans: opts10.ans,
        explain: q10Extra === 0
          ? `由 ${fmt12h(q10InH, q10InM)} 到 ${fmt12h(q10OutH, q10OutM)} 共 ${q10Hours} 小時，未超過首 1 小時，所以只收 <b>$${q10Rate1} 元</b>。`
          : `泊車共 ${q10Hours} 小時 ＝ ${q10HalfUnits} 個半小時。首 1 小時（2 個半小時）收 $${q10Rate1}；餘下 ${q10Extra} 個半小時 × $${q10Rate2} ＝ $${q10Extra * q10Rate2}。總費用 ＝ $${q10Rate1} ＋ $${q10Extra * q10Rate2} ＝ <b>$${q10Fee} 元</b>。`
      });

      // -------------------------------------------------------------
      // 渲染題目 HTML
      // -------------------------------------------------------------
      quizData.forEach((q, idx) => {
        const qDiv = document.createElement('div');
        qDiv.className = 'bg-indigo-50/50 rounded-xl p-5 border border-indigo-200';
        
        let contentHtml = `
          <div class="flex items-center gap-2 mb-3">
            <span class="bg-indigo-600 text-white font-bold text-base px-3 py-1 rounded-md">第 ${idx + 1} 題</span>
            <span class="text-base font-semibold text-indigo-800 bg-indigo-100 px-2 py-0.5 rounded">${q.title}</span>
          </div>
          <div class="text-slate-800 font-medium text-lg md:text-xl mb-4 leading-relaxed">${q.prompt}</div>
        `;

        if (q.type === 'input') {
          contentHtml += `
            <div class="flex items-center gap-2">
              <input type="number" id="q_${q.id}" class="w-32 px-3 py-2 border-2 border-indigo-300 rounded-lg focus:outline-none focus:border-indigo-500 text-center font-bold text-lg" placeholder="答案">
              <span class="font-bold text-slate-700">${q.suffix || ''}</span>
            </div>
          `;
        } else if (q.type === 'multi-input') {
          contentHtml += `<div class="flex flex-wrap items-center gap-3">`;
          q.inputs.forEach(inp => {
            contentHtml += `
              <div class="flex items-center gap-1">
                <input type="number" id="q_${q.id}_${inp.key}" class="w-24 px-3 py-2 border-2 border-indigo-300 rounded-lg focus:outline-none focus:border-indigo-500 text-center font-bold text-lg" placeholder="數字">
                <span class="font-bold text-slate-700">${inp.suffix}</span>
              </div>
            `;
          });
          contentHtml += `</div>`;
        } else if (q.type === 'select') {
          contentHtml += `
            <select id="q_${q.id}" class="px-4 py-2 border-2 border-indigo-300 rounded-lg font-bold text-indigo-900 bg-white focus:outline-none focus:border-indigo-500">
              <option value="">-- 請選擇答案 --</option>
              ${q.options.map(opt => `<option value="${opt}">${opt}</option>`).join('')}
            </select>
          `;
        } else if (q.type === 'select-text') {
          contentHtml += `
            <div class="space-y-2">
              ${q.options.map(opt => `
                <label class="flex items-center gap-3 bg-white p-3 rounded-lg border border-slate-200 cursor-pointer hover:bg-indigo-100/50 transition">
                  <input type="radio" name="q_${q.id}" value="${opt.val}" class="w-4 h-4 text-indigo-600 border-gray-300 focus:ring-indigo-500">
                  <span class="font-semibold text-xl text-slate-800">${opt.label}</span>
                </label>
              `).join('')}
            </div>
          `;
        }

        contentHtml += `
          <div id="explain_${q.id}" class="clock-explain hidden mt-4 p-4 bg-white/90 rounded-lg border-2 border-indigo-200">
            <span class="step-label">【解題步驟】</span><br>
            <span id="explain_text_${q.id}">${q.explain}</span>
          </div>
        `;

        qDiv.innerHTML = contentHtml;
        container.appendChild(qDiv);
      });
    }

    // ============ Firebase 紀錄協議（強化版：成功/失敗都唔會靜默） ============
    const TEST_NAME = "⏱️ 秒與24小時報時制（圖形版）";
    const PENDING_KEY = "math15_pending_logs";
    let saveWarned = false;

    function getHKTTimestamp() {
      const now = new Date();
      const hkt = new Date(now.getTime() + 8 * 60 * 60 * 1000);
      return hkt.toISOString().replace('T', ' ').slice(0, 19);
    }

    function getSafeUsername() {
      try {
        return (window.getUsername && window.getUsername()) || "訪客";
      } catch (e) {
        return "訪客";
      }
    }

    // auth.js 係以 module 方式載入，可能比本頁 script 遲；所以要等，唔可以「冇就當成功」
    function fbReady() {
      return !!(window.db && window.addDoc && window.collection);
    }

    function waitForFb(timeoutMs) {
      const limit = timeoutMs || 6000;
      return new Promise(function (resolve) {
        if (fbReady()) return resolve(true);
        const t0 = Date.now();
        const iv = setInterval(function () {
          if (fbReady()) { clearInterval(iv); resolve(true); }
          else if (Date.now() - t0 > limit) { clearInterval(iv); resolve(false); }
        }, 250);
      });
    }

    // 黃色橫幅：成績未存入時一定讓用家睇到（唔再靜默）
    function showSaveWarning(early) {
      if (saveWarned || document.getElementById('save-warning')) return;
      saveWarned = true;
      const isFile = location.protocol === 'file:';
      const bar = document.createElement('div');
      bar.id = 'save-warning';
      bar.className = 'fixed bottom-0 left-0 right-0 z-[300] bg-amber-100 border-t-4 border-amber-500 text-amber-900 px-4 py-3 text-sm font-bold text-center leading-relaxed';
      let msg;
      if (early) {
        msg = '⚠️ 此頁以「檔案」方式開啟（file://），瀏覽器會封鎖 Firebase —— 這次練習的成績<b>不會</b>存入學習記錄。' +
              '<br>請改用網站網址開啟：<b>http://localhost:3000/math15.html</b> 或 <b>https://centered-flame-vrg6.here.now/math15.html</b>';
      } else if (isFile) {
        msg = '⚠️ 這次的成績<b>未能</b>存入學習記錄（file:// 開啟會封鎖 Firebase）。' +
              '<br>請改用網站網址開啟後再做一次：<b>http://localhost:3000/math15.html</b>';
      } else {
        msg = '⚠️ 這次的成績<b>未能</b>存入學習記錄（Firebase 未載入或寫入失敗）。已暫存在本機，下次在正常網頁開啟時會自動補寫。';
      }
      bar.innerHTML = msg + ' <span style="text-decoration:underline;cursor:pointer">（關閉）</span>';
      bar.querySelector('span').onclick = function () { bar.remove(); };
      document.body.appendChild(bar);
    }

    // 失敗時暫存本機，下次成功載入時自動補寫（唔會白做）
    function queuePending(coll, data) {
      try {
        const q = JSON.parse(localStorage.getItem(PENDING_KEY) || '[]');
        q.push({ coll: coll, data: data });
        localStorage.setItem(PENDING_KEY, JSON.stringify(q));
      } catch (e) { /* localStorage 被封鎖都冇辦法 */ }
    }

    async function flushPending() {
      if (!fbReady()) return;
      let q = [];
      try { q = JSON.parse(localStorage.getItem(PENDING_KEY) || '[]'); } catch (e) { q = []; }
      if (!q.length) return;
      const keep = [];
      for (let i = 0; i < q.length; i++) {
        try {
          await window.addDoc(window.collection(window.db, q[i].coll), q[i].data);
        } catch (e) {
          keep.push(q[i]);
        }
      }
      try { localStorage.setItem(PENDING_KEY, JSON.stringify(keep)); } catch (e) {}
    }

    async function writeDoc(coll, data) {
      if (!(await waitForFb(6000))) {
        queuePending(coll, data);
        showSaveWarning(false);
        return false;
      }
      try {
        await window.addDoc(window.collection(window.db, coll), data);
        return true;
      } catch (e) {
        console.warn('Firestore write failed:', e);
        queuePending(coll, data);
        showSaveWarning(false);
        return false;
      }
    }

    async function logEntrance() {
      await writeDoc("test-log", {
        username: getSafeUsername(),
        test: TEST_NAME,
        timestamp: getHKTTimestamp(),
        status: "entered"
      });
    }

    async function saveIncorrectAnswers(records) {
      const timestamp = getHKTTimestamp();
      for (const r of records) {
        await writeDoc("incorrect-log", {
          username: getSafeUsername(),
          question: r.question,
          correctAnswer: r.correctAnswer,
          studentAnswer: r.studentAnswer,
          timestamp: timestamp
        });
      }
    }

    async function saveCompletion(totalScore, totalTimeSec) {
      return writeDoc("test-log", {
        username: getSafeUsername(),
        test: TEST_NAME,
        score: totalScore,
        timespend: Math.floor(totalTimeSec / 60) + "分" + (totalTimeSec % 60) + "秒",
        timestamp: getHKTTimestamp()
      });
    }

    // 交卷後一次過處理：完成記錄 + 錯題記錄，任何一步失敗都會提示
    async function persistResults(totalScore, wrongRecords, totalTimeSec) {
      await saveCompletion(totalScore, totalTimeSec);
      if (wrongRecords && wrongRecords.length > 0) {
        await saveIncorrectAnswers(wrongRecords);
      }
    }

    window.onUserSet = function () {
      logEntrance();
      flushPending();
    };

    // 以 file:// 開啟就即刻提示（唔好等小朋友做完 10 題才發現冇記錄）
    if (location.protocol === 'file:') {
      document.addEventListener('DOMContentLoaded', function () { showSaveWarning(true); });
    }
    window.addEventListener('load', function () { flushPending(); });

    document.addEventListener('wheel', (event) => {
      if (document.activeElement && document.activeElement.type === 'number') {
        if (document.activeElement === event.target || document.activeElement.contains(event.target)) {
          event.preventDefault();
        }
      }
    }, { passive: false });

    function checkAnswers() {
      if (isSubmitted) return;
      isSubmitted = true;

      const submitBtn = document.getElementById('submit-btn');
      if (submitBtn) submitBtn.classList.add('hidden');
      let score = 0;

      const wrongRecords = [];

      quizData.forEach(q => {
        let isCorrect = false;
        let studentAnswerText = '';
        let correctAnswerText = '';
        const explainBox = document.getElementById(`explain_${q.id}`);
        const questionText = `第${q.id}題 ${q.title}：${String(q.prompt).replace(/<br\s*\/?>/gi, ' ').replace(/<[^>]+>/g, '').slice(0, 60)}`;

        if (q.type === 'input') {
          const userVal = document.getElementById(`q_${q.id}`).value.trim();
          if (userVal === q.ans) isCorrect = true;
          studentAnswerText = userVal || '未填';
          correctAnswerText = q.ans;
        } else if (q.type === 'multi-input') {
          let allRight = true;
          const stuParts = [], ansParts = [];
          q.inputs.forEach(inp => {
            const val = document.getElementById(`q_${q.id}_${inp.key}`).value.trim();
            if (val !== inp.ans) allRight = false;
            stuParts.push(val || '未填');
            ansParts.push(inp.ans);
          });
          if (allRight) isCorrect = true;
          studentAnswerText = stuParts.join(' ， ');
          correctAnswerText = ansParts.join(' ， ');
        } else if (q.type === 'select') {
          const userVal = document.getElementById(`q_${q.id}`).value;
          if (userVal === q.ans) isCorrect = true;
          studentAnswerText = userVal || '未填';
          correctAnswerText = q.ans;
        } else if (q.type === 'select-text') {
          const selected = document.querySelector(`input[name="q_${q.id}"]:checked`);
          if (selected && selected.value === q.ans) isCorrect = true;
          studentAnswerText = selected ? selected.value : '未填';
          correctAnswerText = q.ans;
        }

        if (isCorrect) score++;

        if (!isCorrect) {
          wrongRecords.push({
            question: questionText,
            correctAnswer: correctAnswerText,
            studentAnswer: studentAnswerText
          });
        }

        if (explainBox) {
          explainBox.classList.remove('hidden');
          if (isCorrect) {
            explainBox.classList.add('bg-green-50', 'border-green-300');
            explainBox.classList.remove('bg-red-50', 'border-red-300');
          } else {
            explainBox.classList.add('bg-red-50', 'border-red-300');
            explainBox.classList.remove('bg-green-50', 'border-green-300');
          }
        }
      });

      const board = document.getElementById('result-board');
      const scoreText = document.getElementById('score-text');
      const feedbackText = document.getElementById('feedback-text');

      if (scoreText) scoreText.innerText = `${score} / 10`;
      if (feedbackText) {
        if (score === 10) {
          feedbackText.innerText = "🌟 太棒了！全部答對！你對時鐘圖形的觀察與時間計算已經融會貫通！";
        } else if (score >= 7) {
          feedbackText.innerText = "👍 表現很好！請參閱紅框內的【解題步驟】加強指針觀察練習！";
        } else {
          feedbackText.innerText = "💪 不要氣餒，仔細對照時鐘圖形與【解題步驟】，再試一次吧！";
        }
      }

      if (board) {
        board.classList.remove('hidden');
        board.scrollIntoView({ behavior: 'smooth' });
      }

      const totalTimeSec = quizStartTime ? Math.floor((Date.now() - quizStartTime) / 1000) : 0;
      // 唔會靜默失敗：成功就寫入 Firestore，失敗會顯示黃色警示並暫存本機待補寫
      persistResults(score * 10, wrongRecords, totalTimeSec);
    }

    // 確保網頁載入完成後立即生成題目
    document.addEventListener("DOMContentLoaded", function() {
      generateQuiz();
    });

    window.onload = function() {
      generateQuiz();
      try {
        if (window.getUsername && window.getUsername() !== "訪客") {
          logEntrance();
        }
      } catch (e) {}
    };
  </script>
</body>
</html>
