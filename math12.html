        let currentQuestions = [];

        const numToChineseMap = {'0':'零', '1':'一', '2':'二', '3':'三', '4':'四', '5':'五', '6':'六', '7':'七', '8':'八', '9':'九'};
        
        function numberToTraditionalChinese(num) {
            if (num < 10000 || num > 99999) return num.toString();
            const str = num.toString();
            const d萬 = parseInt(str[0]);
            const d千 = parseInt(str[1]);
            const d百 = parseInt(str[2]);
            const d十 = parseInt(str[3]);
            const d個 = parseInt(str[4]);

            let result = numToChineseMap[d萬] + "萬";

            if (d千 !== 0) {
                result += numToChineseMap[d千] + "千";
            } else if (d百 !== 0 || d十 !== 0 || d個 !== 0) {
                result += "零";
            }

            if (d百 !== 0) {
                result += numToChineseMap[d百] + "百";
            } else if (d千 !== 0 && (d十 !== 0 || d個 !== 0) && !result.endsWith("零")) {
                result += "零";
            }

            if (d十 !== 0) {
                result += numToChineseMap[d十] + "十";
            } else if (d百 !== 0 && d個 !== 0 && !result.endsWith("零")) {
                result += "零";
            }

            if (d個 !== 0) {
                result += numToChineseMap[d個];
            }

            result = result.replace(/零+/g, '零').replace(/零$/, '');
            return result;
        }

        function createAbacusSVG(digitsArray) {
            const places = ['萬位', '千位', '百位', '十位', '個位'];
            const svgWidth = 320;
            const svgHeight = 220;
            const colSpacing = 55;
            const startX = 50;
            const baseY = 170;
            const beadHeight = 11;
            const rodHeight = 115;

            let rodsHTML = '';
            let beadsHTML = '';
            let labelsHTML = '';

            digitsArray.forEach((count, colIdx) => {
                const x = startX + colIdx * colSpacing;
                
                rodsHTML += `<line x1="${x}" y1="${baseY - rodHeight}" x2="${x}" y2="${baseY}" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>`;
                
                for (let b = 0; b < count; b++) {
                    const cy = baseY - 10 - (b * (beadHeight + 2));
                    beadsHTML += `<ellipse cx="${x}" cy="${cy}" rx="18" ry="5.5" fill="#e11d48" stroke="#9f1239" stroke-width="1.5"/>`;
                }

                labelsHTML += `
                    <g transform="translate(${x - 22}, ${baseY + 5})">
                        <rect x="0" y="0" width="44" height="28" rx="6" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1.5"/>
                        <text x="22" y="18" font-size="12" font-weight="bold" fill="#334155" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">${places[colIdx]}</text>
                    </g>
                `;
            });

            return `
                <svg viewBox="0 0 ${svgWidth} ${svgHeight}" class="w-full max-w-[320px] mx-auto filter drop-shadow-sm">
                    <rect x="15" y="${baseY}" width="290" height="12" rx="4" fill="#881337" />
                    ${rodsHTML}
                    ${beadsHTML}
                    ${labelsHTML}
                </svg>
            `;
        }

        function getRandomInt(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        function getDigits(num) {
            return num.toString().padStart(5, '0').split('').map(Number);
        }

        function shuffleArray(array) {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        // Question Generators
        function generateQ1() {
            const num = getRandomInt(10000, 99999);
            const digits = getDigits(num);
            const chinese = numberToTraditionalChinese(num);
            return {
                type: 'abacus_read',
                title: '看看算柱所表示的數，回答以下問題。',
                digits: digits,
                number: num,
                chineseAnswer: chinese,
                explanation: `算柱萬位有 ${digits[0]} 粒珠、千位有 ${digits[1]} 粒、百位有 ${digits[2]} 粒、十位有 ${digits[3]} 粒、個位有 ${digits[4]} 粒。\n阿拉伯數字：${num}。\n中文讀作：「${chinese}」。`
            };
        }

        function generateQ2() {
            const num = getRandomInt(10000, 99999);
            const digits = getDigits(num);
            const placeNames = ['萬', '千', '百', '十', '個'];
            const placeMultipliers = [10000, 1000, 100, 10, 1];

            let p1 = getRandomInt(0, 4);
            let p2 = getRandomInt(0, 4);
            while (p2 === p1) { p2 = getRandomInt(0, 4); }

            // A digit may appear in several places (e.g. 「4」 in 34418 → 千位 or 百位).
            // Collect ALL valid (place, value) pairs for each asked digit.
            const validPositionsFor = (d) => [0, 1, 2, 3, 4]
                .filter(i => digits[i] === d)
                .map(i => ({ place: placeNames[i], val: digits[i] * placeMultipliers[i] }));
            const p1Valid = validPositionsFor(digits[p1]);
            const p2Valid = validPositionsFor(digits[p2]);
            const fmtValid = (list) => list.map(v => `在${v.place}位，表示 ${v.val}`).join('；或');

            return {
                type: 'place_value_analysis',
                title: `在「${num}」這個數中：`,
                number: num,
                p1: { digit: digits[p1], place: placeNames[p1], val: digits[p1] * placeMultipliers[p1] },
                p2: { digit: digits[p2], place: placeNames[p2], val: digits[p2] * placeMultipliers[p2] },
                p1Valid: p1Valid,
                p2Valid: p2Valid,
                explanation: `數字「${digits[p1]}」${fmtValid(p1Valid)}。數字「${digits[p2]}」${fmtValid(p2Valid)}。`
            };
        }

        function generateQ3() {
            const baseNum = getRandomInt(10000, 96000);
            const digits = getDigits(baseNum);
            const offsets = [3, 30, 300, 3000, 50, 500, 2000];
            const offset = offsets[getRandomInt(0, offsets.length - 1)];
            const isMore = Math.random() > 0.3;
            const targetNum = isMore ? baseNum + offset : baseNum - offset;

            return {
                type: 'abacus_offset',
                title: `右圖算柱表示一個五位數。這個數 ${isMore ? '多' : '少'} ${offset} 是多少？`,
                baseNum: baseNum,
                digits: digits,
                offset: offset,
                isMore: isMore,
                correctAnswer: targetNum,
                explanation: `算柱原本表示的數是 ${baseNum}。\n計算：${baseNum} ${isMore ? '+' : '-'} ${offset} = ${targetNum}。`
            };
        }

        function generateQ4() {
            let digits = [getRandomInt(1, 9)];
            for (let i = 0; i < 4; i++) {
                digits.push(getRandomInt(0, 9));
            }
            digits = shuffleArray(digits);

            const types = ['最大的五位奇數', '最小的五位偶數', '最大的五位數', '最小的五位數'];
            const targetType = types[getRandomInt(0, types.length - 1)];

            function getPermutations(arr) {
                let res = [];
                function permute(curr, remaining) {
                    if (remaining.length === 0) {
                        if (curr[0] !== 0) res.push(parseInt(curr.join('')));
                        return;
                    }
                    for (let i = 0; i < remaining.length; i++) {
                        permute([...curr, remaining[i]], remaining.slice(0, i).concat(remaining.slice(i + 1)));
                    }
                }
                permute([], arr);
                return [...new Set(res)];
            }

            const valids = getPermutations(digits);
            let ans = null;
            if (targetType === '最大的五位奇數') {
                const odds = valids.filter(n => n % 2 !== 0);
                ans = odds.length ? Math.max(...odds) : null;
            } else if (targetType === '最小的五位偶數') {
                const evens = valids.filter(n => n % 2 === 0);
                ans = evens.length ? Math.min(...evens) : null;
            } else if (targetType === '最大的五位數') {
                ans = Math.max(...valids);
            } else {
                ans = Math.min(...valids);
            }

            if (!ans) return generateQ4();

            return {
                type: 'digit_cards',
                title: `從 ${digits.join('、')} 中選出這五個數字，排出【${targetType}】。`,
                cards: digits,
                targetType: targetType,
                correctAnswer: ans,
                explanation: `使用數字卡 ${digits.join(', ')} 組成${targetType}（首位萬位不能為0），正確解答為 ${ans}。`
            };
        }

        function generateQ5() {
            const isAscending = Math.random() > 0.5;
            const orderStr = isAscending ? '由低至高（由小至大）' : '由高至低（由大至小）';
            const base = getRandomInt(20000, 80000);
            
            let nums = [
                base,
                base + getRandomInt(120, 600),
                base + getRandomInt(700, 1800)
            ];
            nums = shuffleArray(nums);
            let sorted = [...nums].sort((a, b) => isAscending ? a - b : b - a);

            return {
                type: 'ordering',
                title: `把以下三個數【${orderStr}】排列出來：`,
                numbers: nums,
                correctOrder: sorted,
                explanation: `${orderStr}排列結果為：${sorted.join(' ， ')}。`
            };
        }

        // Q6: Scenario Question from JSON Dataset
        function generateQ6() {
            const randomScenario = shoppingScenariosJSON[getRandomInt(0, shoppingScenariosJSON.length - 1)];
            const validItems = randomScenario.options.filter(o => o.price <= randomScenario.budget).map(o => o.name);

            return {
                type: 'scenario_json',
                scenario: randomScenario,
                validNames: validItems,
                explanation: `${randomScenario.person}預算為 $${randomScenario.budget}。\n售價低於或等於預算 $${randomScenario.budget} 的選項有：${validItems.join(' 及 ')}。`
            };
        }

        function generateQ7() {
            const minVal = getRandomInt(12000, 75000);
            const maxVal = minVal + getRandomInt(400, 900);
            const correctOpt = getRandomInt(minVal + 1, maxVal - 1);

            const wrong1 = minVal - getRandomInt(10, 300);
            const wrong2 = maxVal + getRandomInt(10, 300);
            const wrong3 = maxVal + getRandomInt(301, 700);

            let choices = shuffleArray([
                { val: correctOpt, correct: true },
                { val: wrong1, correct: false },
                { val: wrong2, correct: false },
                { val: wrong3, correct: false }
            ]);

            return {
                type: 'range_mc',
                title: `方格內的數可能是以下哪個數？`,
                minVal: minVal,
                maxVal: maxVal,
                choices: choices,
                correctVal: correctOpt,
                explanation: `方格內的數必須大於 ${minVal} 並且小於 ${maxVal}。只有 ${correctOpt} 符合要求。`
            };
        }

        function generateQ8() {
            const presets = [
                { beads: 5, label: '最小的五位奇數', answer: 10013, exp: '萬位放1粒珠，個位需為奇數（放3粒珠），其餘1粒珠放十位以保持數值最小，答案為 10013。' },
                { beads: 5, label: '最大的五位數', answer: 50000, exp: '要使數值最大，5粒珠全部放在最高的萬位，答案為 50000。' },
                { beads: 4, label: '最小的五位數', answer: 10003, exp: '萬位放1粒珠，剩餘3粒珠放在個位以保持最小，答案為 10003。' }
            ];
            const chosen = presets[getRandomInt(0, presets.length - 1)];

            return {
                type: 'bead_constraint',
                title: `在算柱上畫 ${chosen.beads} 粒算珠，表示【${chosen.label}】。這個數是多少？`,
                correctAnswer: chosen.answer,
                explanation: chosen.exp
            };
        }

        function generateQ9() {
            const baseNum = getRandomInt(10000, 95000);
            const digits = getDigits(baseNum);
            const addVal = 3000;
            const ans = baseNum + addVal;

            return {
                type: 'abacus_read',
                title: `右圖算柱表示一個五位數。這個數多 ${addVal} 是多少？`,
                digits: digits,
                number: baseNum,
                correctAnswer: ans,
                explanation: `算柱表示的數是 ${baseNum}。${baseNum} + ${addVal} = ${ans}。`
            };
        }

        function generateQ10() {
            const minR = getRandomInt(20, 50) * 1000 + 1000; // e.g. 21000
            const maxR = minR + 4000; // e.g. 25000
            const isEven = Math.random() > 0.5;
            const conditionStr = isEven ? '五位偶數' : '五位奇數';

            return {
                type: 'range_condition',

                minR: minR,
                maxR: maxR,

        }

        function submitQuiz() {
            if (isSubmitted) return;
            isSubmitted = true;

            let correctCount = 0;
            const wrongRecords = [];

            currentQuestions.forEach((q, idx) => {
                const qNum = idx + 1;
                const card = document.getElementById(`q_card_${qNum}`);
                const badge = document.getElementById(`badge_${qNum}`);
                const exp = document.getElementById(`explanation_${qNum}`);

                let isCorrect = false;
                let studentAnswerText = '';
                let correctAnswerText = '';
                let questionText = q.title || q.type;

                if (q.type === 'abacus_read' && q.chineseAnswer) {
                    const ansA = parseInt(document.getElementById(`input_${qNum}_a`).value || '0');
                    const ansB = (document.getElementById(`input_${qNum}_b`).value || '').trim().replace(/\s+/g, '');
                    isCorrect = (ansA === q.number) && (ansB === q.chineseAnswer);
                    studentAnswerText = `${ansA} / ${ansB || '未填'}`;
                    correctAnswerText = `${q.number} / ${q.chineseAnswer}`;

                } else if (q.type === 'place_value_analysis') {
                    const a1 = (document.getElementById(`input_${qNum}_a1`).value || '').trim();
                    const a2 = parseInt(document.getElementById(`input_${qNum}_a2`).value || '0');
                    const b1 = (document.getElementById(`input_${qNum}_b1`).value || '').trim();
                    const b2 = parseInt(document.getElementById(`input_${qNum}_b2`).value || '0');

                    // Accept ANY valid position for the digit (e.g. 「4」 in 34418: 千位=4000 or 百位=400)
                    isCorrect = q.p1Valid.some(v => a1 === v.place && a2 === v.val)
                             && q.p2Valid.some(v => b1 === v.place && b2 === v.val);
                    studentAnswerText = `${a1 || '未填'}位=${a2}；${b1 || '未填'}位=${b2}`;
                    correctAnswerText = `${q.p1Valid.map(v => v.place + '位=' + v.val).join(' 或 ')}；${q.p2Valid.map(v => v.place + '位=' + v.val).join(' 或 ')}`;

                } else if (q.type === 'abacus_offset') {
                    const ans = parseInt(document.getElementById(`input_${qNum}`).value || '0');
                    isCorrect = ans === q.correctAnswer;
                    studentAnswerText = isNaN(ans) ? '未填' : String(ans);
                    correctAnswerText = String(q.correctAnswer);

                } else if (q.type === 'digit_cards') {
                    const ans = parseInt(document.getElementById(`input_${qNum}`).value || '0');
                    isCorrect = ans === q.correctAnswer;
                    studentAnswerText = isNaN(ans) ? '未填' : String(ans);
                    correctAnswerText = String(q.correctAnswer);

                } else if (q.type === 'ordering') {
                    const a1 = parseInt(document.getElementById(`input_${qNum}_1`).value || '0');
                    const a2 = parseInt(document.getElementById(`input_${qNum}_2`).value || '0');
                    const a3 = parseInt(document.getElementById(`input_${qNum}_3`).value || '0');
                    isCorrect = (a1 === q.correctOrder[0]) && (a2 === q.correctOrder[1]) && (a3 === q.correctOrder[2]);
                    studentAnswerText = [a1, a2, a3].join(' , ');
                    correctAnswerText = q.correctOrder.join(' , ');

                } else if (q.type === 'scenario_json') {
                    const checkboxes = document.querySelectorAll(`input[name="chk_${qNum}"]:checked`);
                    const selected = Array.from(checkboxes).map(c => c.value);
                    isCorrect = selected.length === q.validNames.length && q.validNames.every(n => selected.includes(n));
                    studentAnswerText = selected.length ? selected.join('及') : '未填';
                    correctAnswerText = q.validNames.join('及');
                    questionText = `【情境題】${q.scenario.itemCategory}採購（預算$${q.scenario.budget}）`;

                } else if (q.type === 'range_mc') {
                    const selected = document.querySelector(`input[name="opt_${qNum}"]:checked`);
                    if (selected) isCorrect = parseInt(selected.value) === q.correctVal;
                    studentAnswerText = selected ? selected.value : '未填';
                    correctAnswerText = String(q.correctVal);

                } else if (q.type === 'bead_constraint') {
                    const ans = parseInt(document.getElementById(`input_${qNum}`).value || '0');
                    isCorrect = ans === q.correctAnswer;
                    studentAnswerText = isNaN(ans) ? '未填' : String(ans);
                    correctAnswerText = String(q.correctAnswer);

                } else if (q.type === 'abacus_read' && q.correctAnswer) {
                    const ans = parseInt(document.getElementById(`input_${qNum}`).value || '0');
                    isCorrect = ans === q.correctAnswer;
                    studentAnswerText = isNaN(ans) ? '未填' : String(ans);
                    correctAnswerText = String(q.correctAnswer);

                } else if (q.type === 'range_condition') {
                    const ans = parseInt(document.getElementById(`input_${qNum}`).value || '0');

                    isCorrect = (ans > q.minR && ans < q.maxR) && (q.isEven ? isEvenAns : !isEvenAns);
                    studentAnswerText = isNaN(ans) ? '未填' : String(ans);
                    correctAnswerText = `介乎 ${q.minR} 與 ${q.maxR} 之間的${q.isEven ? '偶數' : '奇數'}`;
                }

                if (!isCorrect) {
                    wrongRecords.push({
                        question: `第${qNum}題 ${questionText}`,
                        correctAnswer: correctAnswerText,
                        studentAnswer: studentAnswerText
                    });
                }

                badge.classList.remove('hidden');
                exp.classList.remove('hidden');

                if (isCorrect) {
                    correctCount++;
                    card.classList.add('border-emerald-400', 'bg-emerald-50/20');
                    badge.className = "text-xs font-bold px-2.5 py-1 rounded-full bg-emerald-100 text-emerald-700 border border-emerald-300";
                    badge.innerText = "✓ 正確 (+10分)";
                    exp.className = "mt-4 p-4 rounded-xl bg-emerald-50 text-xs md:text-sm border-l-4 border-emerald-500 text-emerald-900";
                    exp.innerHTML = `<span class="font-bold">【答案正確】</span> ${q.explanation.replace(/\n/g, '<br>')}`;
                } else {
                    card.classList.add('border-rose-300', 'bg-rose-50/20');
                    badge.className = "text-xs font-bold px-2.5 py-1 rounded-full bg-rose-100 text-rose-700 border border-rose-300";
                    badge.innerText = "✗ 錯誤";
                    exp.className = "mt-4 p-4 rounded-xl bg-rose-50 text-xs md:text-sm border-l-4 border-rose-500 text-rose-900";
                    exp.innerHTML = `<span class="font-bold">【解題步驟】</span> ${q.explanation.replace(/\n/g, '<br>')}`;
                }
            });

            const totalScore = correctCount * 10;
            document.getElementById('headerScore').innerText = totalScore;
            document.getElementById('scoreHeaderBox').classList.remove('hidden');
            
            document.getElementById('finalScore').innerText = totalScore;
            const badgeElem = document.getElementById('feedbackBadge');

            if (totalScore === 100) {
                badgeElem.className = "inline-block px-6 py-2 rounded-full font-bold text-base bg-emerald-500 text-white shadow-md";
                badgeElem.innerText = "🌟 太棒了！100分滿分！五位數高手！";
            } else if (totalScore >= 80) {
                badgeElem.className = "inline-block px-6 py-2 rounded-full font-bold text-base bg-emerald-100 text-emerald-800 border border-emerald-300";
                badgeElem.innerText = "👏 表現非常優秀！";
            } else if (totalScore >= 60) {
                badgeElem.className = "inline-block px-6 py-2 rounded-full font-bold text-base bg-amber-100 text-amber-800 border border-amber-300";
                badgeElem.innerText = "👍 及格了！請認真檢討錯題！";
            } else {
                badgeElem.className = "inline-block px-6 py-2 rounded-full font-bold text-base bg-rose-100 text-rose-800 border border-rose-300";
                badgeElem.innerText = "💪 不要灰心！再試一次加油！";
            }

            document.getElementById('resultSummary').classList.remove('hidden');
            document.getElementById('resultSummary').scrollIntoView({ behavior: 'smooth' });

            // ============ Firebase logging on completion ============
            const totalTimeSec = quizStartTime ? Math.floor((Date.now() - quizStartTime) / 1000) : 0;
            saveCompletion(totalScore, totalTimeSec);
            if (wrongRecords.length > 0) {
                saveIncorrectAnswers(wrongRecords);
            }
        }

        window.onload = function() {
            generateNewQuiz();
            // Log entrance if user already logged in (cookie set); auth.js will
            // call window.onUserSet -> logEntrance() for fresh logins.
            if (window.getUsername && window.getUsername() !== "訪客") {
                logEntrance();
            }
        };
    </script>
</body>
</html>
